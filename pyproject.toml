[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "holodori.scores"
description = "Render holodori scores (sus) to chart images (png)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "HolodoriDB" }]
keywords = ["hololive Dreams", "holodori", "SUS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow",
    "numpy",
    "sonolus-converters @ git+https://github.com/UntitledCharts/sonolus-level-converters",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "build",
    "bumpver",
    "twine",
]

[project.urls]
"Homepage" = "https://github.com/HolodoriDB/holodori-scores"
"Documentation" = "https://github.com/HolodoriDB/holodori-scores/wiki"
"Bug Tracker" = "https://github.com/HolodoriDB/holodori-scores/issues"

[tool.setuptools.package-data]
"*" = ["*.png", "*.otf"]

[tool.bumpver]
current_version = "v0.1.14"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"setup.py" = [
    "versio = {version}",
    "versio = {pep440_version}",
]
"README.md" = [
    "{version}",
    "{pep440_version}",
]
